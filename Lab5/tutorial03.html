<!DOCTYPE html>
<html>
  <head>
    <title>Lab 5 Leaflet Tutorial 3</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

  </head>
  <body>
    <div id="mapid" style = "height: 500px"></div>

    <script>
        var mymap = L.map('mapid').setView([51.505, -0.09], 13);
        L.tileLayer('https://api.mapbox.com/styles/v1/{id}/tiles/{z}/{x}/{y}?access_token={accessToken}', {
            attribution: '© <a href="https://www.mapbox.com/about/maps/">Mapbox<a> © <a href="http://www.openstreetmap.org/copyright">OpenStreetMap</a> <strong><a href="https://www.mapbox.com/map-feedback/" target="_blank">Improve this map</a><strong>',
            tileSize: 512,
            maxZoom: 18,
            zoomOffset: -1,
            id: 'mapbox/streets-v11',
            accessToken: 'pk.eyJ1IjoiaG1kaWF6LTA4MjMiLCJhIjoiY213eWh5eDl5MGNvNjMwcG43aDBiY2FhbyJ9.cdTDyvNx1smQtpzgY78Aqg'
        }).addTo(mymap);

        var greenIcon = L.icon({
	        iconUrl: 'leaf-green.png',
	        shadowUrl: 'leaf-shadow.png',
	        iconSize:     [38, 95], // size of the icon
	        shadowSize:   [50, 64], // size of the shadow
	        iconAnchor:   [22, 94], // point of the icon which will correspond to marker's location
	        shadowAnchor: [4, 62],  // the same for the shadow
	        popupAnchor:  [-3, -76] // point from which the popup should open relative to the iconAnchor
        });

        var marker = L.marker([51.5, -0.09], {icon: greenIcon}).addTo(mymap);

        var LeafIcon = L.Icon.extend({
	        options: {
		    shadowUrl: 'leaf-shadow.png',
		    iconSize:     [38, 95],
		    shadowSize:   [50, 64],
		    iconAnchor:   [22, 94],
		    shadowAnchor: [4, 62],
		    popupAnchor:  [-3, -76]
	        }  
        });

        var greenIcon = new LeafIcon({iconUrl: 'leaf-green.png'});
	    var redIcon = new LeafIcon({iconUrl: 'leaf-red.png'});
	    var orangeIcon = new LeafIcon({iconUrl: 'leaf-orange.png'});

        L.marker([51.5, -0.09], {icon: greenIcon}).addTo(mymap).bindPopup("I am a green leaf.");
        L.marker([51.495, -0.083], {icon: redIcon}).addTo(mymap).bindPopup("I am a red leaf.");
        L.marker([51.49, -0.1], {icon: orangeIcon}).addTo(mymap).bindPopup("I am an orange leaf.");

    </script>
  </body>
</html>
